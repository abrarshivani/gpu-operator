name: Third-Party Notices Release Artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag or full 40-character commit SHA'
        required: true
        type: string
      attach_to_release:
        description: 'Attach the generated document to the GitHub Release for the tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.generate.outputs.artifact_name }}
      resolved_sha: ${{ steps.resolve.outputs.resolved_sha }}
    steps:
      - name: Validate the requested ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          ATTACH_TO_RELEASE: ${{ inputs.attach_to_release }}
        run: |
          if [[ ! "${INPUT_REF}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.-]*|[0-9a-fA-F]{40})$ ]]; then
            echo "::error::'${INPUT_REF}' is not a release tag or a full 40-character commit SHA."
            exit 1
          fi
          if [[ "${ATTACH_TO_RELEASE}" == "true" && "${INPUT_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::attach_to_release needs a release tag; '${INPUT_REF}' is a commit SHA, which has no release."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the ref to be a tag or a commit on one
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [[ "${INPUT_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            if [[ "$(git rev-parse HEAD)" != "$(echo "${INPUT_REF}" | tr '[:upper:]' '[:lower:]')" ]]; then
              echo "::error::${INPUT_REF} is not the checked-out commit."
              exit 1
            fi
            exit 0
          fi
          tag_commit="$(git rev-parse --verify --quiet "refs/tags/${INPUT_REF}^{commit}")" \
            || { echo "::error::'${INPUT_REF}' is not a tag in this repository."; exit 1; }
          if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
            echo "::error::tag '${INPUT_REF}' points at ${tag_commit}, not the checked-out commit."
            exit 1
          fi

      - name: Require the ref to carry the release notices tooling
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          generator="tools/generate-third-party-notices.sh"
          if [[ ! -f "${generator}" ]]; then
            echo "::error::'${INPUT_REF}' has no ${generator}; it predates the third-party notices tooling."
            exit 1
          fi
          if ! grep -q 'generate-third-party-notices.sh release' "${generator}"; then
            echo "::error::the ${generator} at '${INPUT_REF}' has no 'release' subcommand; it predates the release notices tooling."
            exit 1
          fi

      - name: Resolve the ref to a commit
        id: resolve
        run: echo "resolved_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Get Golang version
        run: |
          GOLANG_VERSION=$( grep "GOLANG_VERSION ?=" versions.mk )
          echo "GOLANG_VERSION=${GOLANG_VERSION##GOLANG_VERSION ?= }" >> "${GITHUB_ENV}"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Setup Go Proxy
        id: setup-go-proxy
        uses: nv-gha-runners/setup-artifactory-go-proxy@a15ec16ff434e8ca3b0f76919f902080e66ebc14 # main

      - name: Generate the release notices
        id: generate
        env:
          GOPROXY: ${{ steps.setup-go-proxy.outputs.goproxy-url }}
          INPUT_REF: ${{ inputs.ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          make install-tools
          artifact_name="gpu-operator-${INPUT_REF#v}-THIRD_PARTY_NOTICES.md"
          bash tools/generate-third-party-notices.sh release \
            --version "${INPUT_REF}" \
            --link-ref "${INPUT_REF}" \
            --repo-url "${REPO_URL}" \
            --output "${RUNNER_TEMP}/${artifact_name}"
          {
            echo "artifact_name=${artifact_name}"
            echo "artifact_path=${RUNNER_TEMP}/${artifact_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload the notices artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.generate.outputs.artifact_name }}
          path: ${{ steps.generate.outputs.artifact_path }}
          if-no-files-found: error

      - name: Summarise
        env:
          ARTIFACT_NAME: ${{ steps.generate.outputs.artifact_name }}
          RESOLVED_SHA: ${{ steps.resolve.outputs.resolved_sha }}
        run: |
          {
            echo "### Third-party notices generated"
            echo
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            echo "- Commit: \`${RESOLVED_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  attach-to-release:
    if: ${{ inputs.attach_to_release }}
    needs: [generate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the release and the tag to match the generated document
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_REF: ${{ inputs.ref }}
          ARTIFACT_NAME: ${{ needs.generate.outputs.artifact_name }}
          RESOLVED_SHA: ${{ needs.generate.outputs.resolved_sha }}
        run: |
          tag_commit="$(git rev-parse --verify --quiet "refs/tags/${INPUT_REF}^{commit}")" \
            || { echo "::error::'${INPUT_REF}' is not a tag in this repository."; exit 1; }
          if [[ "${tag_commit}" != "${RESOLVED_SHA}" ]]; then
            echo "::error::tag '${INPUT_REF}' now points at ${tag_commit}, but the document was generated from ${RESOLVED_SHA}."
            exit 1
          fi
          gh release view "${INPUT_REF}" >/dev/null \
            || { echo "::error::no GitHub Release exists for tag '${INPUT_REF}'."; exit 1; }
          if gh release view "${INPUT_REF}" --json assets --jq '.assets[].name' | grep -Fxq "${ARTIFACT_NAME}"; then
            echo "::error::release '${INPUT_REF}' already has an asset named '${ARTIFACT_NAME}'; delete it first to replace it."
            exit 1
          fi

      - name: Download the notices artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.generate.outputs.artifact_name }}
          path: ${{ runner.temp }}/notices

      - name: Attach the notices to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_REF: ${{ inputs.ref }}
          ARTIFACT_PATH: ${{ runner.temp }}/notices/${{ needs.generate.outputs.artifact_name }}
        run: gh release upload "${INPUT_REF}" "${ARTIFACT_PATH}"

      - name: Summarise
        env:
          INPUT_REF: ${{ inputs.ref }}
          ARTIFACT_NAME: ${{ needs.generate.outputs.artifact_name }}
        run: |
          {
            echo "### Third-party notices attached"
            echo
            echo "- Asset: \`${ARTIFACT_NAME}\`"
            echo "- Release: \`${INPUT_REF}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
