name: Publish Main Chart

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  variables:
    permissions:
      contents: read
    uses: ./.github/workflows/variables.yaml

  fetch-latest-images:
    needs: [variables]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      resolved_images: ${{ steps.images.outputs.resolved_images }}
      main_version: ${{ steps.main-version.outputs.main_version }}
    steps:
      - name: Require the default branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Main charts are published only from ${DEFAULT_BRANCH}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get regctl version
        run: |
          REGCTL_VERSION=$(grep "REGCTL_VERSION ?=" versions.mk)
          echo "REGCTL_VERSION=${REGCTL_VERSION##REGCTL_VERSION ?= }" >> "${GITHUB_ENV}"

      - name: Install regctl
        uses: regclient/actions/regctl-installer@148669fe4b19151fcab6e00c6df2db43b9e2b097
        with:
          release: ${{ env.REGCTL_VERSION }}

      - name: Verify the operator image exists
        env:
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          if ! regctl manifest head "${OPERATOR_IMAGE}:${OPERATOR_VERSION}" > /dev/null; then
            echo "::error::${OPERATOR_IMAGE}:${OPERATOR_VERSION} is not built yet; rerun once CI has published it"
            exit 1
          fi

      - name: Get latest component images and generate values override file
        id: images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          set -euo pipefail

          TOOLKIT_IMAGE=$(.github/scripts/get-latest-images.sh toolkit)
          DEVICE_PLUGIN_IMAGE=$(.github/scripts/get-latest-images.sh device-plugin)
          MIG_MANAGER_IMAGE=$(.github/scripts/get-latest-images.sh mig-manager)
          DRIVER_MANAGER_IMAGE=$(.github/scripts/get-latest-images.sh driver-manager)
          VGPU_DEVICE_MANAGER_IMAGE=$(.github/scripts/get-latest-images.sh vgpu-device-manager)
          KATA_SANDBOX_DEVICE_PLUGIN_IMAGE=$(.github/scripts/get-latest-images.sh kata-sandbox-device-plugin)
          KUBEVIRT_GPU_DEVICE_PLUGIN_IMAGE=$(.github/scripts/get-latest-images.sh kubevirt-gpu-device-plugin)
          CC_MANAGER_IMAGE=$(.github/scripts/get-latest-images.sh cc-manager)

          .github/scripts/generate-values-overrides.sh values-overrides.yaml \
            "toolkit=${TOOLKIT_IMAGE}" \
            "devicePlugin=${DEVICE_PLUGIN_IMAGE}" \
            "gfd=${DEVICE_PLUGIN_IMAGE}" \
            "migManager=${MIG_MANAGER_IMAGE}" \
            "driver.manager=${DRIVER_MANAGER_IMAGE}" \
            "vgpuManager.driverManager=${DRIVER_MANAGER_IMAGE}" \
            "vfioManager=${DRIVER_MANAGER_IMAGE}" \
            "vfioManager.driverManager=${DRIVER_MANAGER_IMAGE}" \
            "vgpuDeviceManager=${VGPU_DEVICE_MANAGER_IMAGE}" \
            "kataSandboxDevicePlugin=${KATA_SANDBOX_DEVICE_PLUGIN_IMAGE}" \
            "sandboxDevicePlugin=${KUBEVIRT_GPU_DEVICE_PLUGIN_IMAGE}" \
            "ccManager=${CC_MANAGER_IMAGE}" \
            "nodeStatusExporter=${OPERATOR_IMAGE}:${OPERATOR_VERSION}"

          echo "resolved_images=${TOOLKIT_IMAGE} ${DEVICE_PLUGIN_IMAGE} ${MIG_MANAGER_IMAGE} ${DRIVER_MANAGER_IMAGE} ${VGPU_DEVICE_MANAGER_IMAGE} ${KATA_SANDBOX_DEVICE_PLUGIN_IMAGE} ${KUBEVIRT_GPU_DEVICE_PLUGIN_IMAGE} ${CC_MANAGER_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Set main version
        id: main-version
        env:
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          echo "main_version=0.0.0-main.$(date -u +%Y%m%d%H%M%S).g${OPERATOR_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload values override file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: values-overrides
          path: values-overrides.yaml
          retention-days: 30

  publish-main-chart:
    needs: [variables, fetch-latest-images]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-helm-oci-chart.yaml
    with:
      operator_image: ${{ needs.variables.outputs.operator_image }}
      operator_version: ${{ needs.variables.outputs.operator_version }}
      main_chart_version: ${{ needs.fetch-latest-images.outputs.main_version }}

  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs: [variables, fetch-latest-images, publish-main-chart]
    if: ${{ always() && github.event_name == 'schedule' && (needs.variables.result == 'failure' || needs.fetch-latest-images.result == 'failure' || needs.publish-main-chart.result == 'failure') }}
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Send Slack alert notification
        if: ${{ env.SLACK_BOT_TOKEN != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": ":x: *GPU Operator Main Chart Publish Failed*\n\n*Workflow:* ${{ github.workflow }}\n*Repository:* ${{ github.repository }}\n*Trigger:* ${{ github.event_name }}\n\n*Resolved Images:* ${{ needs.fetch-latest-images.outputs.resolved_images || 'not resolved; see the run log' }}\n\n*Details:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Run>\n\n${{ secrets.SLACK_MENTION_LIST }}"
            }
