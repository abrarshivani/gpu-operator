name: Publish Main Chart and Bundle

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  variables:
    permissions:
      contents: read
    uses: ./.github/workflows/variables.yaml

  prepare-main-values:
    needs: [variables]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      resolved_images: ${{ steps.images.outputs.resolved_images }}
      main_version: ${{ steps.main-version.outputs.main_version }}
    steps:
      - name: Require the default branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Main charts are published only from ${DEFAULT_BRANCH}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get regctl version
        run: |
          REGCTL_VERSION=$(grep "REGCTL_VERSION ?=" versions.mk)
          echo "REGCTL_VERSION=${REGCTL_VERSION##REGCTL_VERSION ?= }" >> "${GITHUB_ENV}"

      - name: Install regctl
        uses: regclient/actions/regctl-installer@148669fe4b19151fcab6e00c6df2db43b9e2b097
        with:
          release: ${{ env.REGCTL_VERSION }}

      - name: Verify the operator image exists
        env:
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          if ! regctl manifest head "${OPERATOR_IMAGE}:${OPERATOR_VERSION}" > /dev/null; then
            echo "::error::${OPERATOR_IMAGE}:${OPERATOR_VERSION} is not built yet; rerun once CI has published it"
            exit 1
          fi

      - name: Get latest component images and generate values override file
        id: images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          set -euo pipefail

          COMPONENTS=(toolkit device-plugin mig-manager driver-manager vgpu-device-manager
            kata-sandbox-device-plugin kubevirt-gpu-device-plugin cc-manager)
          IMAGE_LOOKUP_DIR="${RUNNER_TEMP}/image-lookups"
          mkdir -p "${IMAGE_LOOKUP_DIR}"

          declare -A LOOKUP_PIDS
          for COMPONENT in "${COMPONENTS[@]}"; do
            .github/scripts/get-latest-images.sh "${COMPONENT}" \
              > "${IMAGE_LOOKUP_DIR}/${COMPONENT}.image" \
              2> >(sed -u "s/^/[${COMPONENT}] /" >&2) &
            LOOKUP_PIDS[${COMPONENT}]=$!
          done

          FAILED_COMPONENTS=()
          for COMPONENT in "${COMPONENTS[@]}"; do
            if ! wait "${LOOKUP_PIDS[${COMPONENT}]}"; then
              FAILED_COMPONENTS+=("${COMPONENT}")
            fi
          done

          if [[ ${#FAILED_COMPONENTS[@]} -gt 0 ]]; then
            echo "::error::Image lookup failed for ${FAILED_COMPONENTS[*]}"
            exit 1
          fi

          TOOLKIT_IMAGE=$(< "${IMAGE_LOOKUP_DIR}/toolkit.image")
          DEVICE_PLUGIN_IMAGE=$(< "${IMAGE_LOOKUP_DIR}/device-plugin.image")
          MIG_MANAGER_IMAGE=$(< "${IMAGE_LOOKUP_DIR}/mig-manager.image")
          DRIVER_MANAGER_IMAGE=$(< "${IMAGE_LOOKUP_DIR}/driver-manager.image")
          VGPU_DEVICE_MANAGER_IMAGE=$(< "${IMAGE_LOOKUP_DIR}/vgpu-device-manager.image")
          KATA_SANDBOX_DEVICE_PLUGIN_IMAGE=$(< "${IMAGE_LOOKUP_DIR}/kata-sandbox-device-plugin.image")
          KUBEVIRT_GPU_DEVICE_PLUGIN_IMAGE=$(< "${IMAGE_LOOKUP_DIR}/kubevirt-gpu-device-plugin.image")
          CC_MANAGER_IMAGE=$(< "${IMAGE_LOOKUP_DIR}/cc-manager.image")

          .github/scripts/generate-values-overrides.sh values-overrides.yaml \
            "toolkit=${TOOLKIT_IMAGE}" \
            "devicePlugin=${DEVICE_PLUGIN_IMAGE}" \
            "gfd=${DEVICE_PLUGIN_IMAGE}" \
            "migManager=${MIG_MANAGER_IMAGE}" \
            "driver.manager=${DRIVER_MANAGER_IMAGE}" \
            "vgpuManager.driverManager=${DRIVER_MANAGER_IMAGE}" \
            "vfioManager=${DRIVER_MANAGER_IMAGE}" \
            "vfioManager.driverManager=${DRIVER_MANAGER_IMAGE}" \
            "vgpuDeviceManager=${VGPU_DEVICE_MANAGER_IMAGE}" \
            "kataSandboxDevicePlugin=${KATA_SANDBOX_DEVICE_PLUGIN_IMAGE}" \
            "sandboxDevicePlugin=${KUBEVIRT_GPU_DEVICE_PLUGIN_IMAGE}" \
            "ccManager=${CC_MANAGER_IMAGE}" \
            "nodeStatusExporter=${OPERATOR_IMAGE}:${OPERATOR_VERSION}"

          echo "resolved_images=${TOOLKIT_IMAGE} ${DEVICE_PLUGIN_IMAGE} ${MIG_MANAGER_IMAGE} ${DRIVER_MANAGER_IMAGE} ${VGPU_DEVICE_MANAGER_IMAGE} ${KATA_SANDBOX_DEVICE_PLUGIN_IMAGE} ${KUBEVIRT_GPU_DEVICE_PLUGIN_IMAGE} ${CC_MANAGER_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Apply values override file
        run: .github/scripts/apply-values-overrides.sh deployments/gpu-operator values-overrides.yaml

      - name: Point operator and validator at the main operator image
        env:
          OPERATOR_IMAGE: ${{ needs.variables.outputs.operator_image }}
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          set -euo pipefail

          export OPERATOR_REPOSITORY="${OPERATOR_IMAGE%/*}"
          export OPERATOR_IMAGE_NAME="${OPERATOR_IMAGE##*/}"
          yq -i '
            (.operator, .validator) |= (
              .repository = strenv(OPERATOR_REPOSITORY) |
              .image = strenv(OPERATOR_IMAGE_NAME) |
              .version = strenv(OPERATOR_VERSION)
            )
          ' deployments/gpu-operator/values.yaml

      - name: Set main version
        id: main-version
        env:
          OPERATOR_VERSION: ${{ needs.variables.outputs.operator_version }}
        run: |
          echo "main_version=0.0.0-main.$(date -u +%Y%m%d%H%M%S).g${OPERATOR_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload values override file and merged chart values
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-values
          path: |
            values-overrides.yaml
            deployments/gpu-operator/values.yaml
          retention-days: 30

  publish-main-chart:
    needs: [variables, prepare-main-values]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-helm-oci-chart.yaml
    with:
      operator_image: ${{ needs.variables.outputs.operator_image }}
      operator_version: ${{ needs.variables.outputs.operator_version }}
      main_chart_version: ${{ needs.prepare-main-values.outputs.main_version }}

  publish-main-bundle:
    needs: [variables, prepare-main-values]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Get Golang version
        run: |
          GOLANG_VERSION=$(grep "GOLANG_VERSION ?=" versions.mk)
          echo "GOLANG_VERSION=${GOLANG_VERSION##GOLANG_VERSION ?= }" >> "${GITHUB_ENV}"

      - name: Get regctl version
        run: |
          REGCTL_VERSION=$(grep "REGCTL_VERSION ?=" versions.mk)
          echo "REGCTL_VERSION=${REGCTL_VERSION##REGCTL_VERSION ?= }" >> "${GITHUB_ENV}"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Install regctl
        uses: regclient/actions/regctl-installer@148669fe4b19151fcab6e00c6df2db43b9e2b097
        with:
          release: ${{ env.REGCTL_VERSION }}

      - name: Install Operator SDK
        run: |
          set -euo pipefail

          OPERATOR_SDK_VERSION="$(awk -F': ' '/operators.operatorframework.io.metrics.builder:/ { print $2 }' bundle/metadata/annotations.yaml | sed 's/^operator-sdk-//')"
          if [[ -z "${OPERATOR_SDK_VERSION}" ]]; then
            echo "::error::OPERATOR_SDK_VERSION not found in bundle metadata"
            exit 1
          fi

          curl -fsSLo operator-sdk \
            "https://github.com/operator-framework/operator-sdk/releases/download/${OPERATOR_SDK_VERSION}/operator-sdk_linux_amd64"
          chmod +x operator-sdk
          sudo mv operator-sdk /usr/local/bin/operator-sdk
          operator-sdk version

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Download values override file and merged chart values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: main-values
          path: ${{ github.workspace }}

      - name: Update OLM bundle images
        run: |
          python3 .github/scripts/update-csv-images.py \
            --values deployments/gpu-operator/values.yaml \
            --chart deployments/gpu-operator/Chart.yaml \
            --csv bundle/manifests/gpu-operator-certified.clusterserviceversion.yaml

      - name: Check the CSV related images include every override image
        env:
          CSV: bundle/manifests/gpu-operator-certified.clusterserviceversion.yaml
        run: |
          set -euo pipefail

          OVERRIDE_IMAGES=$(yq '.. | select(tag == "!!map" and has("image")) | .repository + "/" + .image + ":" + .version' values-overrides.yaml | sort -u)
          CSV_RELATED_IMAGES=$(yq '.spec.relatedImages[].image | sub("@sha256:[0-9a-f]+$", "")' "${CSV}" | sort -u)
          MISSING_IMAGES=$(comm -23 <(echo "${OVERRIDE_IMAGES}") <(echo "${CSV_RELATED_IMAGES}"))
          if [[ -n "${MISSING_IMAGES}" ]]; then
            echo "::error::CSV relatedImages are missing override images:"
            echo "${MISSING_IMAGES}"
            exit 1
          fi

      - name: Validate OLM bundle
        run: |
          set -euo pipefail

          operator-sdk bundle validate ./bundle
          make validate-csv

      - name: Build and push OLM bundle image
        env:
          MAIN_VERSION: ${{ needs.prepare-main-values.outputs.main_version }}
          GH_REPOSITORY: ${{ github.repository }}
          VERSION: ""
          DEFAULT_CHANNEL: "stable"
          CHANNELS: "stable"
          BUNDLE_IMAGE_BUILD_PLATFORM_OPTIONS: "--platform=linux/amd64,linux/arm64 --push"
        run: |
          set -euo pipefail

          REPOSITORY="$(echo "${GH_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          BUNDLE_IMAGE="ghcr.io/${REPOSITORY}/gpu-operator-bundle:${MAIN_VERSION}"
          make build-bundle-image DOCKER="docker buildx" BUNDLE_IMAGE="${BUNDLE_IMAGE}"
          echo "::notice::Published OLM bundle image ${BUNDLE_IMAGE}"

  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs: [variables, prepare-main-values, publish-main-chart, publish-main-bundle]
    if: ${{ always() && github.event_name == 'schedule' && (needs.variables.result == 'failure' || needs.prepare-main-values.result == 'failure' || needs.publish-main-chart.result == 'failure' || needs.publish-main-bundle.result == 'failure') }}
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Send Slack alert notification
        if: ${{ env.SLACK_BOT_TOKEN != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": ":x: *GPU Operator Main Chart or Bundle Publish Failed*\n\n*Workflow:* ${{ github.workflow }}\n*Repository:* ${{ github.repository }}\n*Trigger:* ${{ github.event_name }}\n\n*Resolved Images:* ${{ needs.prepare-main-values.outputs.resolved_images || 'not resolved; see the run log' }}\n\n*Details:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Run>\n\n${{ secrets.SLACK_MENTION_LIST }}"
            }
