name: Forward Compatibility

on:
  schedule:
    - cron: '17 4 * * 1'  # Weekly on Monday at 4:17 AM UTC
  workflow_dispatch:  # Manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  MAIN_CHART_MAX_AGE_HOURS: 48

jobs:
  variables:
    permissions:
      contents: read
    uses: ./.github/workflows/variables.yaml

  find-main-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      chart_reference: ${{ steps.main-chart.outputs.chart_reference }}
      chart_version: ${{ steps.main-chart.outputs.chart_version }}
      operator_version: ${{ steps.main-chart.outputs.operator_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get regctl version
        run: |
          REGCTL_VERSION=$(grep "REGCTL_VERSION ?=" versions.mk)
          echo "REGCTL_VERSION=${REGCTL_VERSION##REGCTL_VERSION ?= }" >> "${GITHUB_ENV}"

      - name: Install regctl
        uses: regclient/actions/regctl-installer@148669fe4b19151fcab6e00c6df2db43b9e2b097
        with:
          release: ${{ env.REGCTL_VERSION }}

      - name: Find the newest main chart
        id: main-chart
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          LOWERCASE_REPO_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | awk '{print tolower($0)}')
          CHART_REPOSITORY="ghcr.io/${LOWERCASE_REPO_OWNER}/gpu-operator/charts/gpu-operator"

          {
            .github/scripts/get-latest-main-chart.sh "${CHART_REPOSITORY}" "${MAIN_CHART_MAX_AGE_HOURS}"
            echo "chart_reference=oci://${CHART_REPOSITORY}"
          } >> "${GITHUB_OUTPUT}"

  run-e2e-tests:
    needs: [variables, find-main-chart]
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/e2e-tests.yaml
    with:
      operator_image: ${{ needs.variables.outputs.operator_image_base }}
      operator_version: ${{ needs.find-main-chart.outputs.operator_version }}
      chart_reference: ${{ needs.find-main-chart.outputs.chart_reference }}
      chart_version: ${{ needs.find-main-chart.outputs.chart_version }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs: [variables, find-main-chart, run-e2e-tests]
    if: ${{ always() && (needs.variables.result == 'failure' || needs.find-main-chart.result == 'failure' || needs.run-e2e-tests.result == 'failure') }}
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Describe the tested chart
        id: tested-chart
        env:
          CHART_REFERENCE: ${{ needs.find-main-chart.outputs.chart_reference }}
          CHART_VERSION: ${{ needs.find-main-chart.outputs.chart_version }}
        run: |
          if [[ -n "${CHART_VERSION}" ]]; then
            echo "description=\`${CHART_REFERENCE} --version ${CHART_VERSION}\` (run \`helm show values\` on it to see the component images)" >> "${GITHUB_OUTPUT}"
          else
            echo "description=No usable main chart from the last ${MAIN_CHART_MAX_AGE_HOURS} hours (none published, or the registry could not be read); see the run log" >> "${GITHUB_OUTPUT}"
          fi

      - name: Send Slack alert notification
        if: ${{ env.SLACK_BOT_TOKEN != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": ":x: *Forward Compatibility Test Failed for GPU Operator*\n\n*Workflow:* ${{ github.workflow }}\n*Repository:* ${{ github.repository }}\n*Trigger:* ${{ github.event_name }}\n\n*Tested Chart:* ${{ steps.tested-chart.outputs.description }}\n\n*Details:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Run>\n\n${{ secrets.SLACK_MENTION_LIST }}"
            }
